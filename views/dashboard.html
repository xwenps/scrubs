<section class="view dash">
  <header class="view-header">
    <div class="view-header__text">
      <h1>Dashboard</h1>
      <p data-range-summary></p>
    </div>
  </header>

  <div class="toolbar dash__toolbar">
    <div class="toolbar__group" data-range-slot></div>
    <div class="toolbar__group" data-calendar-slot></div>
    <div class="toolbar__spacer"></div>
    <span class="range-summary" data-event-count></span>
    <button class="btn btn--sm" type="button" data-action="refresh">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Refresh
    </button>
  </div>

  <div data-config-banner></div>

  <div data-dash-body></div>
</section>
