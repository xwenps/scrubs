server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # MIME types come from the base image's http-level `include mime.types`,
    # which already maps .js to application/javascript — a module served as
    # text/plain would be refused by the browser.

    gzip             on;
    gzip_min_length  512;
    # text/html is always gzipped by nginx and must not be listed again.
    gzip_types       text/css application/javascript application/json image/svg+xml;

    # Hash-routed SPA: every path resolves to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asset filenames are not content-hashed, so the browser must revalidate.
    # Without this a user can be pinned to a stale module after a deploy.
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Generated per environment at container start — never cache it anywhere.
    location = /config/runtime-config.js {
        add_header Cache-Control "no-store" always;
    }

    location ~* \.(?:svg|png|jpg|jpeg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    # The preview harness ships synthetic data and no auth; it has no place in
    # a deployed environment.
    location /dev/ {
        return 404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Defence in depth. The app itself makes no inline-script or eval calls
    # beyond the pre-paint theme script and the generated config.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
